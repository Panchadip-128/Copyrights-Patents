<html><head><style>
body {
    background-color: #021a14;
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    position: relative;
    z-index: 0;
}

/* Isometric Cyber Grid Background */
body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%; right: -50%; bottom: -50%;
    background-image: 
        repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(162, 255, 0, 0.25) 60px),
        repeating-linear-gradient(60deg, transparent, transparent 68px, rgba(162, 255, 0, 0.15) 69.28px),
        repeating-linear-gradient(120deg, transparent, transparent 68px, rgba(162, 255, 0, 0.15) 69.28px);
    background-size: 100vw 100vw;
    z-index: -2;
    pointer-events: none;
}

/* Dark Vignette Overlay */
body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, rgba(2, 26, 20, 0.5) 0%, #021a14 80%);
    z-index: -1;
    pointer-events: none;
}
</style></head><body></body></html>
